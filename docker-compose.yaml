services:

  tg_log_controller_app:
    build:
      context: .
      dockerfile: Dockerfile
    env_file:  
    - .env
    container_name: tg_log_controller
    restart: unless-stopped
    working_dir: /var/www
    volumes:
      - ./:/var/www
      - vendor:/var/www/vendor
    ports:
    - "8000:8000"
    networks:
      - tg_log_controller

  # nginx:
  #   image: nginx:alpine
  #   container_name: laravel_nginx
  #   restart: unless-stopped
  #   ports:
  #     - "8000:80"
  #   volumes:
  #     - ./:/var/www
  #     - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf
  #   depends_on:
  #     - app
  #   networks:
  #     - laravel

  postgres:
    image: postgres:17-alpine
    container_name: tg_log_controller_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_DATABASE}
      POSTGRES_USER: ${DB_USERNAME}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    ports:
      - "5433:${DB_PORT}"
    volumes:
      - tg_log_postgres_data:/var/lib/postgresql/data
    networks:
      - tg_log_controller

  redis:
    image: redis:7-alpine
    container_name: laravel_redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - tg_log_redis_data:/data
    networks:
      - tg_log_controller

networks:
  tg_log_controller:

volumes:
  tg_log_postgres_data:
  tg_log_redis_data:
  vendor: